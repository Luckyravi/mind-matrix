<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sudoku - Mind Matrix</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  min-height: 100vh;
}

/* Floating Back Button */
.back-float {
  position: fixed;
  top: 25px;
  left: 25px;
  z-index: 10000;
  padding: 12px 24px;
  background: rgba(15, 23, 42, 0.95);
  color: white;
  border: 1px solid rgba(99, 102, 241, 0.6);
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
  transition: all 0.3s ease;
  backdrop-filter: blur(12px);
}

.back-float:hover {
  background: #6366f1;
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
}

/* Sudoku Container */
.sudoku-container {
  max-width: 600px;
  margin: 100px auto 40px;
  padding: 30px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  text-align: center;
}

h1 {
  margin: 0 0 30px;
  font-size: 2.5rem;
  text-align: center;
}

.sudoku-grid {
  display: grid;
  grid-template-columns: repeat(9, 50px);
  grid-template-rows: repeat(9, 50px);
  gap: 2px;
  background: #1e2937;
  padding: 2px;
  border: 3px solid #6366f1;
  border-radius: 8px;
  margin: 30px auto;
  width: fit-content;
}

.cell {
  width: 50px;
  height: 50px;
  border: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  font-weight: bold;
  background: rgba(255,255,255,0.05);
  cursor: text;
}

.cell.fixed {
  color: #a5b4fc;
  font-weight: 700;
  background: rgba(99, 102, 241, 0.15);
}

/* Footer */
.footer {
  text-align: center;
  padding: 20px;
  color: #94a3b8;
  font-size: 0.9rem;
}
</style>
</head>
<body>

<!-- Floating Back Button -->
<button class="back-float" onclick="goHome()">
  ← Back to Mind Matrix
</button>

<div class="sudoku-container">
  <h1>🧩 Sudoku</h1>
  <p>Logic + Pattern Thinking</p>

  <!-- Sudoku Grid (9x9) -->
  <div class="sudoku-grid" id="sudoku-grid">
    <!-- Grid will be generated by JavaScript -->
  </div>

  <button onclick="newGame()" 
          style="margin-top:20px; padding:12px 30px; font-size:1.1rem; background:#6366f1; border:none; border-radius:50px; color:white; cursor:pointer;">
    New Game
  </button>
</div>

<div class="footer">
  Mind Matrix • Focus Training
</div>

<script>
// Simple Sudoku Example (You can replace with full solver later)
const grid = document.getElementById('sudoku-grid');

function createSudokuBoard() {
  grid.innerHTML = '';
  for (let i = 0; i < 81; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    
    // Make some cells fixed (pre-filled)
    if (Math.random() > 0.6) {
      cell.textContent = Math.floor(Math.random() * 9) + 1;
      cell.classList.add('fixed');
    } else {
      cell.contentEditable = true;
      cell.addEventListener('input', (e) => {
        if (e.target.textContent.length > 1) e.target.textContent = e.target.textContent[0];
      });
    }
    
    grid.appendChild(cell);
  }
}

function newGame() {
  createSudokuBoard();
}

function goHome() {
  window.location.href = 'index.html';   // Change if your home file name is different
}

// Initialize game
createSudokuBoard();
</script>

</body>
</html>
