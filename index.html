<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mind Matrix!</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  min-height: 100vh;
}

header {
  padding: 20px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}

header h1 {
  margin: 0;
  font-size: 2.3rem;
}

.back-btn {
  padding: 10px 20px;
  background: #334155;
  border: none;
  border-radius: 50px;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

.back-btn:hover {
  background: #6366f1;
}

/* Switch */
.switch {
  display: flex;
  justify-content: center;
  margin: 30px 0;
  gap: 12px;
}

.switch button {
  padding: 12px 32px;
  border: none;
  background: #334155;
  color: white;
  border-radius: 30px;
  cursor: pointer;
  font-weight: 600;
}

.switch button.active {
  background: #6366f1;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 30px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #6366f1;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.card h3 { margin: 0 0 12px; font-size: 1.5rem; }
.card p { color: #cbd5f5; }
</style>
</head>
<body>

<header>
  <h1>🧠 Mind Matrix!</h1>
  <button class="back-btn" onclick="goHome()">Home</button>
</header>

<div class="switch">
  <button class="active" onclick="showSection('games')">Games</button>
  <button onclick="showSection('tools')">Mind Tools</button>
</div>

<!-- Games Section -->
<div id="games" class="section active">
  <div class="grid">
    <div class="card" onclick="openGame('sudoku.html')">
      <h3>🧩 Sudoku</h3>
      <p>Logic + Pattern Thinking</p>
    </div>
    <div class="card" onclick="openGame('shooter_game.html')">
      <h3>🎯 Shooter Game</h3>
      <p>Reaction & Focus Training</p>
    </div>
  </div>
</div>

<!-- Mind Tools Section -->
<div id="tools" class="section">
  <div class="grid">
    <div class="card" onclick="openGame('presence_of_mind_game.html')">
      <h3>🧘 Presence Trainer</h3>
      <p>Real-life Decision Making</p>
    </div>
    <div class="card" onclick="openGame('mindflow100_mic.html')">
      <h3>🌊 MindFlow 100</h3>
      <p>Deep Focus Builder</p>
    </div>
  </div>
</div>

<script>
function showSection(sec) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(sec).classList.add('active');
  
  document.querySelectorAll('.switch button').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function openGame(page) {
  window.location.href = page;
}

function goHome() {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
