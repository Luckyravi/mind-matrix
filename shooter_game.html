<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  #hud {
    display: flex;
    gap: 40px;
    margin-bottom: 10px;
    font-size: 18px;
    letter-spacing: 2px;
  }
  #hud span { color: #0ff; }
  #hud .lives { color: #f55; }
  canvas {
    border: 1px solid #223;
    background: #050510;
    display: block;
    box-shadow: 0 0 40px rgba(0, 200, 255, 0.15);
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    pointer-events: none;
  }
  #overlay h1 { font-size: 42px; color: #0ff; text-shadow: 0 0 20px #0ff; }
  #overlay p { font-size: 16px; color: #aaa; }
  #overlay .score-display { font-size: 24px; color: #ff0; }
  #startBtn {
    margin-top: 8px;
    padding: 12px 36px;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    cursor: pointer;
    letter-spacing: 3px;
    pointer-events: all;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  #startBtn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
  #controls { font-size: 13px; color: #555; margin-top: 6px; }
</style>
</head>
<body>

<div id="hud">
  <div>SCORE: <span id="scoreVal">0</span></div>
  <div>LEVEL: <span id="levelVal">1</span></div>
  <div class="lives">LIVES: <span id="livesVal">3</span></div>
</div>
<canvas id="canvas" width="600" height="700"></canvas>
<div id="overlay">
  <h1>SPACE SHOOTER</h1>
  <p>Defend the galaxy from alien invaders!</p>
  <button id="startBtn">START GAME</button>
  <div id="controls">← → or A D to move &nbsp;|&nbsp; SPACE or Click to shoot</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreVal = document.getElementById('scoreVal');
const levelVal = document.getElementById('levelVal');
const livesVal = document.getElementById('livesVal');

let state = 'menu'; // menu | playing | gameover
let score, lives, level, raf;
let player, bullets, enemies, enemyBullets, particles, stars;
let keys = {};
let shootCooldown = 0;
let enemyDir = 1;
let enemyDropped = false;
let enemyShootTimer = 0;
let bossActive = false;

// ---- Stars background ----
function makeStars() {
  stars = Array.from({length: 120}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.5 + 0.3,
    speed: Math.random() * 0.4 + 0.1,
    alpha: Math.random() * 0.7 + 0.3
  }));
}

// ---- Init ----
function init() {
  score = 0; lives = 3; level = 1;
  bullets = []; enemyBullets = []; particles = [];
  enemyDir = 1; enemyDropped = false;
  enemyShootTimer = 0; bossActive = false;
  shootCooldown = 0;

  player = { x: W / 2, y: H - 60, w: 44, h: 44, speed: 5, invincible: 0 };
  spawnEnemies();
  makeStars();
  updateHUD();
}

function spawnEnemies() {
  enemies = [];
  const rows = Math.min(3 + level, 6);
  const cols = Math.min(8 + Math.floor(level / 2), 12);
  const ex = (W - cols * 52) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const type = r === 0 ? 2 : r <= 1 ? 1 : 0;
      enemies.push({
        x: ex + c * 52 + 26, y: 60 + r * 48,
        w: 32, h: 28, type,
        hp: type === 2 ? 2 : 1,
        points: (type + 1) * 10
      });
    }
  }
}

// ---- HUD ----
function updateHUD() {
  scoreVal.textContent = score;
  levelVal.textContent = level;
  livesVal.textContent = '♥'.repeat(Math.max(lives, 0));
}

// ---- Drawing ----
function drawStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fill();
  });
}

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  // Engine glow
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 12;
  // Body
  ctx.fillStyle = '#1af';
  ctx.beginPath();
  ctx.moveTo(0, -22); ctx.lineTo(16, 16); ctx.lineTo(8, 10);
  ctx.lineTo(0, 14); ctx.lineTo(-8, 10); ctx.lineTo(-16, 16);
  ctx.closePath(); ctx.fill();
  // Cockpit
  ctx.fillStyle = '#0ff';
  ctx.beginPath();
  ctx.ellipse(0, -4, 6, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // Wings
  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(-8, 8); ctx.lineTo(-20, 18); ctx.lineTo(-8, 12); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(8, 8); ctx.lineTo(20, 18); ctx.lineTo(8, 12); ctx.closePath(); ctx.fill();
  ctx.restore();
}

const enemyColors = ['#f55', '#fa0', '#f0f'];
const enemyGlow   = ['#f33', '#f80', '#c0f'];

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.shadowColor = enemyGlow[e.type];
  ctx.shadowBlur = 10;
  ctx.fillStyle = enemyColors[e.type];
  if (e.type === 0) {
    // Crab
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-16, -4, 6, 8); ctx.fillRect(10, -4, 6, 8);
    ctx.fillStyle = '#ff0';
    ctx.beginPath(); ctx.arc(-4, -2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -2, 3, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 1) {
    // Squid
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(14, 8); ctx.lineTo(6, 4);
    ctx.lineTo(0, 10); ctx.lineTo(-6, 4); ctx.lineTo(-14, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.beginPath(); ctx.arc(-4, -2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -2, 3, 0, Math.PI * 2); ctx.fill();
  } else {
    // Commander
    ctx.beginPath();
    ctx.moveTo(-14, 8); ctx.lineTo(-8, -12); ctx.lineTo(0, -16);
    ctx.lineTo(8, -12); ctx.lineTo(14, 8); ctx.lineTo(8, 12);
    ctx.lineTo(-8, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f00';
    ctx.beginPath(); ctx.arc(-4, -2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -2, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBullet(b, isEnemy) {
  ctx.save();
  ctx.shadowColor = isEnemy ? '#f55' : '#0ff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = isEnemy ? '#f55' : '#0ff';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, 3, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// ---- Particles ----
function explode(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * 3 + 1,
      life: 40, maxLife: 40,
      color
    });
  }
}

// ---- Collision ----
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw/2 < bx + bw/2 && ax + aw/2 > bx - bw/2 &&
         ay - ah/2 < by + bh/2 && ay + ah/2 > by - bh/2;
}

// ---- Game loop ----
function update() {
  if (state !== 'playing') return;

  // Player movement
  const spd = player.speed + level * 0.3;
  if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x - player.w/2 > 0)
    player.x -= spd;
  if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x + player.w/2 < W)
    player.x += spd;

  // Shoot
  if (shootCooldown > 0) shootCooldown--;
  if ((keys[' '] || keys['shooting']) && shootCooldown === 0) {
    bullets.push({ x: player.x, y: player.y - 20, vy: -10 });
    shootCooldown = 15;
  }

  // Move player bullets
  bullets = bullets.filter(b => {
    b.y += b.vy;
    return b.y > -10;
  });

  // Enemy movement
  const baseSpeed = 0.6 + level * 0.18;
  const spread = enemies.length > 0 ? Math.max(...enemies.map(e => e.x)) - Math.min(...enemies.map(e => e.x)) : 0;
  const leftEdge = enemies.length > 0 ? Math.min(...enemies.map(e => e.x)) : 0;
  const rightEdge = enemies.length > 0 ? Math.max(...enemies.map(e => e.x)) : W;

  enemyDropped = false;
  if (rightEdge + 20 > W && enemyDir > 0) { enemyDir = -1; enemyDropped = true; }
  if (leftEdge - 20 < 0 && enemyDir < 0) { enemyDir = 1; enemyDropped = true; }

  enemies.forEach(e => {
    e.x += enemyDir * baseSpeed;
    if (enemyDropped) e.y += 16;
  });

  // Enemy shooting
  enemyShootTimer--;
  const shootInterval = Math.max(40 - level * 4, 12);
  if (enemyShootTimer <= 0 && enemies.length > 0) {
    enemyShootTimer = shootInterval + Math.random() * 20;
    const shooter = enemies[Math.floor(Math.random() * enemies.length)];
    enemyBullets.push({ x: shooter.x, y: shooter.y + 16, vy: 4 + level * 0.4 });
  }

  // Move enemy bullets
  enemyBullets = enemyBullets.filter(b => {
    b.y += b.vy;
    return b.y < H + 10;
  });

  // Bullet vs enemy
  bullets = bullets.filter(b => {
    let hit = false;
    enemies = enemies.filter(e => {
      if (!hit && rectsOverlap(b.x, b.y, 6, 16, e.x, e.y, e.w, e.h)) {
        e.hp--;
        hit = true;
        if (e.hp <= 0) {
          score += e.points;
          explode(e.x, e.y, enemyGlow[e.type], 14);
          updateHUD();
          return false;
        }
        explode(e.x, e.y, '#fff', 5);
      }
      return true;
    });
    return !hit;
  });

  // Enemy bullet vs player
  if (player.invincible <= 0) {
    enemyBullets = enemyBullets.filter(b => {
      if (rectsOverlap(b.x, b.y, 6, 16, player.x, player.y, player.w, player.h)) {
        lives--;
        explode(player.x, player.y, '#0ff', 18);
        updateHUD();
        player.invincible = 120;
        if (lives <= 0) { gameOver(); }
        return false;
      }
      return true;
    });
  } else {
    player.invincible--;
  }

  // Enemy reaches bottom
  if (enemies.some(e => e.y + e.h/2 > H - 60)) {
    lives = 0; updateHUD(); gameOver(); return;
  }

  // All enemies dead → next level
  if (enemies.length === 0) {
    level++;
    bullets = []; enemyBullets = [];
    enemyDir = 1;
    spawnEnemies();
    updateHUD();
  }

  // Particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawStars();
  enemies.forEach(drawEnemy);
  bullets.forEach(b => drawBullet(b, false));
  enemyBullets.forEach(b => drawBullet(b, true));
  drawPlayer();
  drawParticles();

  // Ground line
  ctx.strokeStyle = 'rgba(0,200,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - 30); ctx.lineTo(W, H - 30); ctx.stroke();
}

function loop() {
  update();
  draw();
  if (state === 'playing') raf = requestAnimationFrame(loop);
}

// ---- State transitions ----
function startGame() {
  state = 'playing';
  overlay.style.display = 'none';
  init();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function gameOver() {
  state = 'gameover';
  cancelAnimationFrame(raf);
  overlay.innerHTML = `
    <h1 style="color:#f55;text-shadow:0 0 20px #f55">GAME OVER</h1>
    <div class="score-display">SCORE: ${score}</div>
    <div class="score-display" style="color:#0f0;font-size:18px">LEVEL REACHED: ${level}</div>
    <button id="startBtn" onclick="startGame()" style="margin-top:8px;padding:12px 36px;font-size:18px;font-family:'Courier New',monospace;background:transparent;border:2px solid #f55;color:#f55;cursor:pointer;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s" onmouseover="this.style.background='#f55';this.style.color='#000'" onmouseout="this.style.background='transparent';this.style.color='#f55'">PLAY AGAIN</button>
  `;
  overlay.style.display = 'flex';
}

// ---- Input ----
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousedown', () => { keys['shooting'] = true; });
canvas.addEventListener('mouseup', () => { keys['shooting'] = false; });
canvas.addEventListener('mousemove', e => {
  if (state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, mx));
});

// Touch support
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, mx));
}, { passive: false });
canvas.addEventListener('touchstart', e => { keys['shooting'] = true; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', () => { keys['shooting'] = false; });

startBtn.addEventListener('click', startGame);

// Draw starfield on menu
makeStars();
(function menuLoop() {
  if (state !== 'menu') return;
  ctx.clearRect(0, 0, W, H);
  drawStars();
  requestAnimationFrame(menuLoop);
})();
</script>
</body>
</html>
